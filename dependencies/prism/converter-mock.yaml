openapi: 3.0.0
info:
  title: Credential Converter Mock
  version: 1.0.0
servers:
  - url: http://localhost:8004
paths:
  /api:
    post:
      summary: Convert an OB3 credential to ELM/EDC format
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - From
                - To
                - Content
              properties:
                From:
                  type: object
                  properties:
                    Name:
                      type: string
                    Version:
                      type: string
                To:
                  type: object
                  properties:
                    Name:
                      type: string
                    Version:
                      type: string
                Parameters:
                  type: object
                Content:
                  type: string
            example:
              From:
                Name: "OB"
                Version: "3.0"
              To:
                Name: "elm"
                Version: "3.2"
              Parameters:
                PreferredLanguages: ["en"]
              Content: "eyJpZCI6Imh0dHA6Ly9leGFtcGxlLmNvbS9hd2FyZHMvMSJ9"
      responses:
        "200":
          description: Conversion successful
          content:
            application/json:
              schema:
                type: object
                required:
                  - content
                properties:
                  content:
                    type: string
                    description: Base64-encoded converted credential
                example:
                  content: "ewogICJ0eXBlIjogWyJWZXJpZmlhYmxlQ3JlZGVudGlhbCIsICJFdXJvcGVhbkRpZ2l0YWxDcmVkZW50aWFsIl0sCiAgImNyZWRlbnRpYWxTdWJqZWN0IjogeyJpZCI6ICJkaWQ6ZXhhbXBsZTpzdWJqZWN0In0KfQ=="
        "400":
          description: Bad request — invalid input
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
                  message:
                    type: string
              example:
                error: "invalid_input"
                message: "Content is not valid base64"