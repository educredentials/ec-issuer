services:
  ec-issuer:
    platform: "linux/amd64"
    build:
      context: .
      dockerfile: Dockerfile
      target: web-dev
    ports:
      - "8008:8008"
    env_file:
      - .env
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8008
      - ALLOWED_CORS_DOMAINS=http://localhost:8080,http://localhost:3000
      - SSI_AGENT_URL=${SSI_AGENT_URL}
      - AWARDS_SERVICE_URL=${AWARDS_SERVICE_URL}
      - CREDENTIAL_CONVERTER_URL=${CREDENTIAL_CONVERTER_URL}
      - POSTGRES_CONNECTION_STRING=${POSTGRES_CONNECTION_STRING}
      - CREDENTIAL_TEMPLATE_JSON_DIR=${CREDENTIAL_TEMPLATE_JSON_DIR}
    depends_on:
      postgresql:
        condition: service_healthy
      mock-ssi-agent:
        condition: service_started
      mock-oidc-auth:
        condition: service_started
      mock-awards:
        condition: service_started
      mock-converter:
        condition: service_started
      real-converter:
        condition: service_started
      real-ssi-agent:
        condition: service_started
    volumes:
      - ./src:/app/src/:Z
      - ./templates:/etc/templates/:Z
    working_dir: /app

  real-ssi-agent:
    platform: "linux/amd64"
    image: cr.surf.nl/edubadges-educredentials/vc-service:0.4.0
    ports:
      - "3033:3033"
    environment:
      UNICORE__PROFILE: development
      UNICORE__APPLICATION_URL: http://localhost:3033
      UNICORE__PUBLIC_URL: http://localhost:8008
      UNICORE__EVENT_STORE__TYPE: in_memory
      UNICORE__SECRET_MANAGER__STRONGHOLD_PASSWORD: very-secret-secure_password
      UNICORE__METRICS__ENABLED: false
      UNICORE__DID_METHODS__DID_JWK__ENABLED: true
      UNICORE__DID_METHODS__DID_JWK__PREFERRED: true
      UNICORE__DID_METHODS__DID_KEY__ENABLED: true
      UNICORE__DID_METHODS__DID_WEB__ENABLED: true

  mock-ssi-agent:
    platform: "linux/amd64"
    image: stoplight/prism:4
    ports:
      - "8001:4010"
    command: mock -h 0.0.0.0 /app/mock.yaml
    volumes:
      - ./dependencies/prism/ssi-agent-mock.yaml:/app/mock.yaml:Z

  mock-oidc-auth:
    platform: "linux/amd64"
    image: stoplight/prism:4
    ports:
      - "8002:4010"
    command: mock -h 0.0.0.0 /app/mock.yaml
    volumes:
      - ./dependencies/prism/oidc-auth-mock.yaml:/app/mock.yaml:Z

  mock-awards:
    platform: "linux/amd64"
    image: stoplight/prism:4
    ports:
      - "8003:4010"
    command: mock -h 0.0.0.0 /app/mock.yaml
    volumes:
      - ./dependencies/prism/awards-mock.yaml:/app/mock.yaml:Z

  mock-converter:
    platform: "linux/amd64"
    image: stoplight/prism:4
    ports:
      - "8004:4010"
    command: mock -h 0.0.0.0 /app/mock.yaml
    volumes:
      - ./dependencies/prism/converter-mock.yaml:/app/mock.yaml:Z

  real-converter:
    platform: "linux/amd64"
    image: cr.surf.nl/edubadges-educredentials/credential-converter:latest
    ports:
      - "8081:8080"
    environment:
      RUST_BACKTRACE: "1"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s

  postgresql:
    platform: "linux/amd64"
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=ecissuer
      - POSTGRES_PASSWORD=ecissuer
      - POSTGRES_DB=ecissuer
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecissuer -d ecissuer"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgresql_data:/var/lib/postgresql/data

volumes:
  postgresql_data:
