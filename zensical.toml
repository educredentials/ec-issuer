nav = [
  { "Get started" = "src/README.md" },
  { "Features" = "src/features.md" },
  { "Architecture" = "src/architecture.md" },
  { "Ports & adapters" = "src/ports_adapters.md" },
  { "Ports & adapters test" = "src/ports_adapters_test.md" },
  { "Configuration" = "src/configuration.md" },
  { "API reference" = "src/api.md" },
  { "Credential configuration" = "src/credential_configuration.md" },
  { "OIDC4VCI Issuer Agent" = "src/oidc4vci_issuer_agent.md" },
