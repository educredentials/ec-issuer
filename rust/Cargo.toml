[package]
name = "ec-issuer"
version = "0.30.0"
edition = "2021"
description = "Educredentials Issuer - Rust implementation"
license = "MIT"
repository = "https://github.com/educredentials/ec-issuer"
categories = ["network-programming", "authentication"]
keywords = ["credentials", "openbadges", "ssi", "education"]

[dependencies]
axum = { version = "0.8", features = ["json", "tokio"] }
axum-extra = "0.10"
axum-prometheus = "0.1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono", "json", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "local-time"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
jsonwebtoken = "9"
sha2 = "0.10"
data-encoding = "2"
regex = "1"
http = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
prometheus = "0.13"

[dev-dependencies]
wiremock = "0.6"
tokio-test = "0.4"
rand = "0.8"
serde_urlencoded = "0.7"
urlencoding = "2"
url = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
multiple_crate_versions = "allow"

[lints.cargo]
unused_dependencies = "allow"
